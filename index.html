<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KixBix TV</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      height: 82px;
      border-bottom: 2px solid #8a2be2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
    }

    .logo {
      position: relative;
      display: inline-block;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -1px;
      color: #fff;
    }

    .logo .hat {
      position: absolute;
      width: 58px;
      height: auto;
      left: 4px;
      top: -43px;
      transform: rotate(-4deg);
      pointer-events: none;
    }

    .logo span {
      color: #a855f7;
    }

    nav {
      display: flex;
      gap: 12px;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      border: 1px solid #8a2be2;
      padding: 10px 16px;
      border-radius: 7px;
      font-weight: 700;
      font-size: 14px;
      transition: .2s;
    }

    nav a:hover {
      background: #8a2be2;
    }

    main {
      width: min(1450px, 94%);
      margin: 28px auto;
    }

    .section-title {
      margin: 0 0 10px;
      font-size: 15px;
      color: #c084fc;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .watching {
      margin-bottom: 10px;
      font-size: 25px;
      font-weight: 800;
    }

    .watching small {
      color: #aaa;
      font-size: 14px;
      font-weight: 400;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 350px;
      gap: 20px;
    }

    /* VIDiYO PLAYER */

    .player {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #090909;
      border: 2px solid #8a2be2;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 28px rgba(138, 43, 226, .18);
    }

    .player iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .live {
      color: #d8b4fe;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-top: 10px;
    }

    /* CHAT */

    .chat {
      height: 100%;
      min-height: 500px;
      border: 2px solid #8a2be2;
      border-radius: 10px;
      background: #070707;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      padding: 15px 16px;
      border-bottom: 1px solid #3b145f;
      font-size: 18px;
      font-weight: 800;
    }

    .chat-status {
      padding: 7px 16px;
      color: #888;
      font-size: 12px;
      border-bottom: 1px solid #21102f;
    }

    .messages {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
      min-height: 0;
    }

    .message {
      margin-bottom: 13px;
      line-height: 1.35;
      word-wrap: break-word;
    }

    .username {
      color: #c084fc;
      font-weight: 800;
    }

    .timestamp {
      color: #666;
      font-size: 10px;
      margin-left: 5px;
    }

    .chat-input {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #3b145f;
    }

    .chat-input input {
      flex: 1;
      min-width: 0;
      background: #111;
      color: #fff;
      border: 1px solid #54207f;
      border-radius: 6px;
      padding: 11px;
      outline: none;
    }

    .chat-input input:focus {
      border-color: #a855f7;
    }

    .chat-input button {
      background: #8a2be2;
      color: #fff;
      border: 0;
      border-radius: 6px;
      padding: 0 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .chat-input button:hover {
      background: #a855f7;
    }

    .chat-input button:disabled {
      background: #3b145f;
      cursor: not-allowed;
    }

    .chat-error {
      color: #ff6b6b;
      font-size: 12px;
      padding: 8px 14px;
    }

    /* MOBILE */

    @media (max-width: 850px) {
      header {
        padding: 0 16px;
      }

      .logo {
        font-size: 27px;
      }

      nav a {
        padding: 8px 10px;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .chat {
        min-height: 350px;
      }
    }
  </style>

</head>

  </main>

  <!-- FIREBASE -->

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      signInAnonymously
    }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      getDatabase,
      ref,
      push,
      onChildAdded,
      serverTimestamp,
      query,
      limitToLast
    }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


    /* YOUR FIREBASE PROJECT */

    const firebaseConfig = {
      apiKey: "AIzaSyDoJl_MaPjBQZjb0-AMbrSFFNWt8UNfyHg",
      authDomain: "kixbix-tv.firebaseapp.com",
      databaseURL: "https://kixbix-tv-default-rtdb.firebaseio.com",
      projectId: "kixbix-tv",
      storageBucket: "kixbix-tv.firebasestorage.app",
      messagingSenderId: "508606108820",
      appId: "1:508606108820:web:06b6e65c36e9145ebbd081",
      measurementId: "G-9EBEJ0WNQ2"
    };


    /* START FIREBASE */

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const database = getDatabase(app);

    const messagesRef = ref(database, "messages");


    /* CHAT ELEMENTS */

    const messagesBox = document.getElementById("messages");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const chatStatus = document.getElementById("chatStatus");
    const chatError = document.getElementById("chatError");


    /* CREATE ANONYMOUS USERNAME */

    let username = localStorage.getItem("kixbixChatUsername");

    if (!username) {

      const number = Math.floor(1000 + Math.random() * 9000);

      username = "Viewer" + number;

      localStorage.setItem(
        "kixbixChatUsername",
        username
      );
    }


    /* ESCAPE HTML */

    function escapeHTML(text) {

      const div = document.createElement("div");

      div.textContent = text;

      return div.innerHTML;
    }


    /* SHOW MESSAGE */

    function displayMessage(data) {

      const message = data.val();

      if (!message) return;

      const div = document.createElement("div");

      div.className = "message";

      const safeUsername =
        escapeHTML(message.username || "Viewer");

      const safeText =
        escapeHTML(message.text || "");

      let time = "";

      if (message.timestamp) {

        const date =
          new Date(message.timestamp);

        time =
          `<span class="timestamp">${date.toLocaleTimeString([], {
            hour: "numeric",
            minute: "2-digit"
          })}</span>`;
      }

      div.innerHTML =
        `<span class="username">${safeUsername}</span>${time}: ${safeText}`;

      messagesBox.appendChild(div);

      messagesBox.scrollTop =
        messagesBox.scrollHeight;
    }


    /* CONNECT */

    signInAnonymously(auth)

      .then(() => {

        chatStatus.textContent =
          "Chat connected • You are " + username;

        messageInput.disabled = false;

        sendButton.disabled = false;

        onChildAdded(
          query(messagesRef, limitToLast(100)),
          displayMessage
        );

      })

      .catch((error) => {

        console.error(error);

        chatStatus.textContent =
          "Chat unavailable";

        chatError.textContent =
          "Could not connect to chat.";

        messageInput.disabled = true;

        sendButton.disabled = true;

      });


    /* SEND MESSAGE */

    async function sendMessage() {

      const text =
        messageInput.value.trim();

      if (!text) return;

      if (text.length > 300) {

        chatError.textContent =
          "Messages can only be 300 characters.";

        return;
      }

      chatError.textContent = "";

      sendButton.disabled = true;

      try {

        await push(messagesRef, {

          username: username,

          text: text,

          timestamp: serverTimestamp(),

          uid: auth.currentUser.uid

        });

        messageInput.value = "";

      }

      catch (error) {

        console.error(error);

        chatError.textContent =
          "Message could not be sent.";

      }

      sendButton.disabled = false;

      messageInput.focus();
    }


    /* BUTTON */

    sendButton.addEventListener(
      "click",
      sendMessage
    );


    /* ENTER KEY */

    messageInput.addEventListener(
      "keydown",
      (event) => {

        if (event.key === "Enter") {

          event.preventDefault();

          sendMessage();

        }

      }
    );

  </script>
